<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Simulator - 通年キャリアマネジメント Webプロトタイプ</title>
  <meta name="description" content="責任感とジレンマを体験するプロジェクトマネージャー（PM）シミュレーションゲーム">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="debug-screen-badge" class="debug-screen-badge">[DEBUG] Screen: Initializing...</div>

  <header>
    <div class="logo-container">
      <span class="logo-icon">💼</span>
      <h1 class="logo-title">PM Simulator</h1>
    </div>
    <div class="phase-stepper">
      <div class="step-item" id="step-kickoff">① キックオフ</div>
      <span class="step-arrow">➔</span>
      <div class="step-item" id="step-dashboard">② 開発スプリント</div>
      <span class="step-arrow">➔</span>
      <div class="step-item" id="step-result">③ リザルト</div>
    </div>
    <div class="pm-status-badge">
      <span>PMキャリア: <strong id="pm-career-years">1</strong> 年目</span>
      <span>通算完了: <strong id="pm-completed-pjs">0</strong> 件</span>
      <span>行動力: <span class="ap-tag">AP <span id="pm-ap">3</span>/3</span></span>
    </div>
  </header>

  <main id="app-container">
    <!-- 動的にJSでビュー（Kickoff, Dashboard, Result）を更新します -->
  </main>

  <footer>
    <p>PM Simulator Web Prototype &copy; 2026 asabon / Antigravity AI Team</p>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
