[project]
name = "pm-simulator"
version = "0.1.0"
description = "A simulation game to experience software project management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
play-sim = "prototype.src.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["prototype*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=prototype --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-md-report>=0.8.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes (unused imports, etc.)
    "I",   # isort (import sorting)
]
ignore = [
    "E501", # 日本語メッセージ・長いprint文の行長警告を無視
]




